# STEP 1: Top-Level Key Definition
# This 'promotions' key is what Hugo looks for when we call site.Data.coupons.promotions.
# It MUST exist to prevent the "can't evaluate field promotions" interface error.
promotions:

  # STEP 2: Coupon Item 1 (Percentage Discount)
  # High-value offer to incentivize immediate click-through to the Luxor main site.
  - title: "Premium VIP Upgrade"
    discount: "15% OFF"
    code: "LUXORVIP15"
    description: "Get 15% off your first order of 30mil matte or gloss premium plastic cards."
    url: "https://luxorplasticcards.com/"

  # STEP 3: Coupon Item 2 (Feature Upgrade)
  # Upsell offer highlighting a specific, premium physical feature (Frosted clear cards).
  - title: "Free Frosted Finish"
    discount: "FREE UPGRADE"
    code: "FROSTME"
    description: "Upgrade to our luxury frosted glass-like finish for free on orders over 500 cards."
    url: "https://luxorplasticcards.com/clear-plastic-cards/"