<header class="sticky top-0 z-50 w-full bg-white/80 backdrop-blur-lg border-b border-slate-200/80 shadow-sm transition-all duration-300">

    const menu = document.getElementById('mobile-menu');
    menu?.classList.toggle('hidden');
