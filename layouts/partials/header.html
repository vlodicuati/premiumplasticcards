<!-- layouts/partials/header.html -->
<!-- 1. GLASSMORPHIC HEADER CONTAINER -->
<!-- 
  Uses backdrop-blur and a semi-transparent white background to create 
  a frosted glass effect that sits fixed at the top of the viewport.
-->
<header class="sticky top-0 z-50 w-full bg-white/70 backdrop-blur-lg border-b border-gray-200/50 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16 md:h-20">
            
            <!-- 2. BRAND LOGO -->
            <div class="flex-shrink-0 flex items-center">
                <a href="/" class="flex items-center gap-3 group">
                    <!-- Minimalist SVG Icon matching the clean aesthetic -->
                    <div class="p-2 rounded-xl bg-gradient-to-br from-brand-100 to-white shadow-sm border border-brand-200 group-hover:scale-105 transition-transform duration-300">
                        <svg class="h-6 w-6 text-brand-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                        </svg>
                    </div>
                    <!-- Clean, modern typography. Using font-semibold instead of font-black -->
                    <span class="font-semibold text-lg md:text-xl tracking-tight text-brand-900">Premium Plastic Cards</span>
                </a>
            </div>

            <!-- 3. DESKTOP NAVIGATION -->
            <!-- Minimal, refined spacing and subtle hover states -->
            <nav class="hidden md:flex space-x-8 lg:space-x-12">
                <a href="/materials/" class="text-sm font-medium text-brand-600 hover:text-brand-900 transition-colors duration-200">Materials</a>
                <a href="/comparisons/" class="text-sm font-medium text-brand-600 hover:text-brand-900 transition-colors duration-200">Comparisons</a>
                <a href="/guides/" class="text-sm font-medium text-brand-600 hover:text-brand-900 transition-colors duration-200">Guides</a>
            </nav>

            <!-- 4. CALL TO ACTION -->
            <!-- Promotes the primary brand (Luxor) discreetly but effectively -->
            <div class="hidden md:flex items-center">
                <a href="https://luxorplasticcards.com" target="_blank" rel="noopener noreferrer" 
                   class="inline-flex items-center justify-center px-6 py-2.5 border border-transparent text-sm font-medium rounded-full text-white bg-brand-900 hover:bg-brand-800 shadow-md hover:shadow-lg transition-all duration-300 ease-out transform hover:-translate-y-0.5">
                    Shop Premium
                </a>
            </div>

            <!-- 5. MOBILE MENU BUTTON -->
            <div class="flex items-center md:hidden">
                <button type="button" class="inline-flex items-center justify-center p-2 rounded-xl text-brand-700 hover:text-brand-900 hover:bg-brand-50 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-brand-accent transition-colors" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <!-- Icon when menu is closed -->
                    <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</header>
