{{ define "main" }}
<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-24">
  
  <header class="mb-12 border-b border-slate-200 pb-8 text-center">
    {{ with .Params.eyebrow }}
      <p class="text-blue-600 font-extrabold uppercase tracking-widest text-xs mb-3">{{ . }}</p>
    {{ end }}
    
    <h1 class="text-3xl sm:text-5xl font-black text-slate-900 tracking-tight mb-6">
      {{ .Title }}
    </h1>
    
    {{ with .Params.last_updated }}
      <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">
        Last Updated: {{ . | time.Format "January 2, 2006" }}
      </p>
    {{ end }}
  </header>

  <article class="prose prose-slate prose-lg max-w-none prose-headings:font-bold prose-headings:text-slate-900 prose-a:text-blue-600 hover:prose-a:text-blue-800 prose-p:leading-relaxed prose-li:marker:text-slate-400">
    {{ .Content }}
  </article>

</main>
{{ end }}
